# "The Aisle" — CPG / Retail AI segment inserted before "Read These" in the extended edition.
aisle:
  enabled: true
  sources:
    - { name: "Grocery Dive",       url: "https://www.grocerydive.com/feeds/news/",   tier: "2", active: true }
    - { name: "Retail Dive",        url: "https://www.retaildive.com/feeds/news/",    tier: "2", active: true }
    - { name: "Food Dive",          url: "https://www.fooddive.com/feeds/news/",      tier: "2", active: true }
    - { name: "Supermarket News",   url: "https://www.supermarketnews.com/rss.xml",   tier: "2", active: true }
    - { name: "Chain Store Age",    url: "https://chainstoreage.com/rss.xml",         tier: "2", active: true }
