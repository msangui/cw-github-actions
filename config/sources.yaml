# RSS sources. Replaces tool_configs.rss_sources / aisle_sources.
# tier "0" = lab-direct (auto-include, +3 score); "1" = original sources (+1); "2" = other.
# Set active: false to keep a source in the list without fetching it.
window_hours: 48
max_entries_per_feed: 50

main:
  # Tier 0 — lab-direct, always included
  - { name: "OpenAI Blog",                url: "https://openai.com/blog/rss.xml",                                      tier: "0", active: true }
  - { name: "Anthropic News",             url: "https://www.anthropic.com/news/rss.xml",                               tier: "0", active: true }
  - { name: "Google DeepMind",            url: "https://deepmind.google/blog/rss/",                                    tier: "0", active: true }
  - { name: "Meta AI Blog",               url: "https://ai.meta.com/blog/rss/",                                        tier: "0", active: true }
  # Tier 1 — original sources
  - { name: "TechCrunch AI",              url: "https://techcrunch.com/category/artificial-intelligence/feed/",        tier: "1", active: true }
  - { name: "VentureBeat AI",             url: "https://venturebeat.com/category/ai/feed/",                            tier: "1", active: true }
  - { name: "Wired AI",                   url: "https://www.wired.com/feed/tag/ai/latest/rss",                         tier: "1", active: true }
  - { name: "HuggingFace Blog",           url: "https://huggingface.co/blog/feed.xml",                                 tier: "1", active: true }
